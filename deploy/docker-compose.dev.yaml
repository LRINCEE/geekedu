services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geekedu
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  logic-server:
    image: golang:1.25-alpine # 直接使用 Go 环境，不再读取 Dockerfile
    working_dir: /app/logic-server
    volumes:
      - ..:/app                  # 核心：把外层的整个代码目录挂载到容器的 /app
      - go_mod_cache:/go/pkg/mod # 缓存依赖包，加速每次启动
    environment:
      GOPROXY: "https://goproxy.cn,direct" # 加速国内下载
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: geekedu
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_BUCKET: ${OSS_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: "9090"
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-false}
      GRPC_ACCESS_LOG_ENABLED: ${GRPC_ACCESS_LOG_ENABLED:-false}
    command: sh -c "if command -v air >/dev/null 2>&1; then air; else go run .; fi"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9090:9090"

  web-server:
    image: golang:1.25-alpine
    working_dir: /app/web-server
    volumes:
      - ..:/app
      - go_mod_cache:/go/pkg/mod
    environment:
      GOPROXY: "https://goproxy.cn,direct"
      LOGIC_SERVER_ADDR: logic-server:9090
      JWT_SECRET: ${JWT_SECRET}
      HTTP_PORT: "8080"
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-false}
      HTTP_ACCESS_LOG_ENABLED: ${HTTP_ACCESS_LOG_ENABLED:-false}
      GRPC_ACCESS_LOG_ENABLED: ${GRPC_ACCESS_LOG_ENABLED:-false}
    command: sh -c "if command -v air >/dev/null 2>&1; then air; else go run .; fi"
    depends_on:
      - logic-server
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web-server

volumes:
  mysql_data:
  redis_data:
  go_mod_cache: # 声明全局缓存卷
